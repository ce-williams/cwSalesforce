# =============================================================================
# Cloud Wave — Rollback Workflow
# Manually redeploy a previously tagged production artifact.
#
# Usage:
#   Inputs:
#     tag_name — The shortSHA used for the artifact (e.g., "a1b2c3").
#                Matches the artifact named "deploy-cwprod-<shortSHA>".
#     confirm  — Must type exactly "ROLLBACK" to proceed.
#
# How it works:
#   1. Uses gh api to find the artifact by name across all workflow runs.
#      (actions/download-artifact@v4 cannot cross run boundaries without run-id)
#   2. Downloads the artifact zip via GitHub REST API.
#   3. Redeploys the package.xml from that artifact to cwProd.
#   4. Runs RunLocalTests. 1 retry, 30-min timeout.
# =============================================================================
name: "CW Rollback cwProd"

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Short SHA of the artifact to redeploy (e.g., a1b2c3)"
        required: true
        type: string
      confirm:
        description: "Type ROLLBACK to confirm"
        required: true
        type: string

concurrency:
  group: deploy-cwprod
  cancel-in-progress: false

env:
  ORG_ALIAS: cwProd

jobs:
  rollback:
    name: "Rollback cwProd to deploy-cwprod-${{ inputs.tag_name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      actions: read

    steps:
      # -----------------------------------------------------------------------
      - name: "Validate confirmation input"
        run: |
          if [[ "${{ inputs.confirm }}" != "ROLLBACK" ]]; then
            echo "::error::Confirmation must be the word ROLLBACK exactly. Got: '${{ inputs.confirm }}'"
            exit 1
          fi
          echo "Confirmed. Proceeding with rollback of artifact: deploy-cwprod-${{ inputs.tag_name }}"

      # -----------------------------------------------------------------------
      - name: "Checkout"
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      - name: "Install Salesforce CLI"
        run: |
          npm install --global @salesforce/cli@latest
          sf version --verbose

      # -----------------------------------------------------------------------
      - name: "Write JWT key"
        run: |
          echo "${{ secrets.SFDX_JWT_KEY_FILE }}" > /tmp/server.key
          chmod 600 /tmp/server.key

      # -----------------------------------------------------------------------
      # Fix 5: Cross-run artifact retrieval via gh api.
      # actions/download-artifact@v4 requires a run-id for cross-run downloads.
      # We query the Artifacts API by name and download the zip directly.
      # -----------------------------------------------------------------------
      - name: "Find and download artifact via GitHub API"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::group::Artifact Lookup"
          ARTIFACT_NAME="deploy-cwprod-${{ inputs.tag_name }}"
          echo "Searching for artifact: $ARTIFACT_NAME"

          # Query artifacts API (paginated) for matching name
          ARTIFACT_ID=$(gh api \
            "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --paginate \
            -q ".artifacts[] | select(.name == \"$ARTIFACT_NAME\" and .expired == false) | .id" \
            | head -1)

          if [[ -z "$ARTIFACT_ID" ]]; then
            echo "::error::No non-expired artifact found with name: $ARTIFACT_NAME"
            echo "Tip: Artifacts expire after 90 days. Check that the tag_name is correct."
            exit 1
          fi

          echo "Found artifact ID: $ARTIFACT_ID"
          echo "Downloading artifact zip..."

          mkdir -p artifact
          gh api \
            "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" \
            > /tmp/artifact.zip

          unzip -q /tmp/artifact.zip -d artifact/
          rm -f /tmp/artifact.zip

          echo "::endgroup::"

          echo "::group::Artifact Contents"
          find artifact/ -type f | sort
          echo ""
          echo "=== deploy-metadata.json ==="
          cat artifact/deploy-metadata.json 2>/dev/null || echo "(not found)"
          echo ""
          echo "=== package.xml ==="
          cat artifact/package.xml 2>/dev/null || echo "(not found)"
          echo "::endgroup::"

      # -----------------------------------------------------------------------
      - name: "Validate artifact contents"
        run: |
          if [[ ! -f artifact/package.xml ]]; then
            echo "::error::package.xml not found in downloaded artifact."
            exit 1
          fi
          if ! grep -q "<members>" artifact/package.xml 2>/dev/null; then
            echo "::error::package.xml contains no deployable members."
            exit 1
          fi
          echo "Artifact validated — package.xml contains deployable metadata."

      # -----------------------------------------------------------------------
      - name: "Authenticate to cwProd"
        run: |
          sf org login jwt \
            --username    "${{ secrets.SFDX_USERNAME_CWPROD }}" \
            --jwt-key-file /tmp/server.key \
            --client-id   "${{ secrets.SFDX_CONSUMER_KEY_CWPROD }}" \
            --alias       "${{ env.ORG_ALIAS }}" \
            --no-prompt

      # -----------------------------------------------------------------------
      - name: "Pre-flight checks"
        run: |
          echo "::group::Pre-flight: Org Display"
          sf org display --target-org "${{ env.ORG_ALIAS }}" --json
          echo "::endgroup::"
          echo "::group::Pre-flight: API Limits"
          sf limits api display --target-org "${{ env.ORG_ALIAS }}" --json
          echo "::endgroup::"

      # -----------------------------------------------------------------------
      - name: "Redeploy artifact to cwProd (RunLocalTests, with retry)"
        run: |
          PACKAGE_XML="artifact/package.xml"
          ORG="${{ env.ORG_ALIAS }}"

          echo "Deployment Mode : ROLLBACK"
          echo "Target Org      : $ORG"
          echo "Artifact Tag    : ${{ inputs.tag_name }}"
          echo "Test Level      : RunLocalTests"

          MAX_ATTEMPTS=2
          ATTEMPT=1
          FINAL_STATUS="Unknown"

          while [[ $ATTEMPT -le $MAX_ATTEMPTS ]]; do
            echo "==> Rollback deploy attempt $ATTEMPT of $MAX_ATTEMPTS"

            DEPLOY_OUTPUT=$(sf project deploy start \
              --manifest   "$PACKAGE_XML" \
              --target-org "$ORG" \
              --wait       30 \
              --test-level RunLocalTests \
              --json 2>&1 || true)

            FINAL_STATUS=$(echo "$DEPLOY_OUTPUT" | python3 -c "
          import sys, json
          try:
              d = json.loads(sys.stdin.read())
              print(d.get('result', {}).get('status', 'Unknown'))
          except Exception:
              print('ParseError')
          " 2>/dev/null || echo "ParseError")

            echo "$DEPLOY_OUTPUT"
            echo "Deploy status: $FINAL_STATUS"

            if [[ "$FINAL_STATUS" == "Succeeded" ]]; then
              echo "Rollback deploy succeeded on attempt $ATTEMPT."
              break
            fi

            ATTEMPT=$((ATTEMPT + 1))
            if [[ $ATTEMPT -le $MAX_ATTEMPTS ]]; then
              echo "Retrying in 15 seconds..."
              sleep 15
            fi
          done

          if [[ "$FINAL_STATUS" != "Succeeded" ]]; then
            echo "::error::All rollback attempts failed. Final status: $FINAL_STATUS"
            exit 1
          fi

          echo "::notice::Rollback complete. cwProd is now running artifact: deploy-cwprod-${{ inputs.tag_name }}"

      # -----------------------------------------------------------------------
      - name: "Cleanup JWT key"
        if: always()
        run: rm -f /tmp/server.key
