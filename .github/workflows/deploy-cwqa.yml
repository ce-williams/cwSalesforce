# =============================================================================
# Cloud Wave — Deploy to cwQA
# Triggers on push (merge) to the cwqa branch.
# Test level: RunSpecifiedTests if *Test.cls files in delta; else RunLocalTests.
# Deploy strategy: attempt Quick Deploy (cached job ID) → fallback to full deploy.
# Retry: 1 automatic retry (2 total attempts), 30-min timeout each.
# Artifact: deploy-cwqa-<shortSHA> retained 30 days.
# =============================================================================
name: "CW Deploy → cwQA"

on:
  push:
    branches:
      - cwqa

concurrency:
  group: deploy-cwqa
  cancel-in-progress: false

env:
  ORG_ALIAS: cwQA

jobs:
  deploy:
    name: "Deploy to cwQA"
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # -----------------------------------------------------------------------
      - name: "Checkout (full history)"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------------------------------------------------
      - name: "Install Salesforce CLI"
        run: |
          npm install --global @salesforce/cli@latest
          sf version --verbose

      # -----------------------------------------------------------------------
      - name: "Install sfdx-git-delta"
        run: |
          echo 'y' | sf plugins install sfdx-git-delta
          sf sgd --version

      # -----------------------------------------------------------------------
      - name: "Write JWT key"
        run: |
          echo "${{ secrets.SFDX_JWT_KEY_FILE }}" > /tmp/server.key
          chmod 600 /tmp/server.key

      # -----------------------------------------------------------------------
      - name: "Authenticate to cwQA"
        run: |
          sf org login jwt \
            --username    "${{ secrets.SFDX_USERNAME_CWQA }}" \
            --jwt-key-file /tmp/server.key \
            --client-id   "${{ secrets.SFDX_CONSUMER_KEY_CWQA }}" \
            --alias       "${{ env.ORG_ALIAS }}" \
            --no-prompt

      # -----------------------------------------------------------------------
      - name: "Pre-flight checks"
        run: |
          echo "::group::Pre-flight: Org Display"
          sf org display --target-org "${{ env.ORG_ALIAS }}" --json
          echo "::endgroup::"
          echo "::group::Pre-flight: API Limits"
          sf limits api display --target-org "${{ env.ORG_ALIAS }}" --json
          echo "::endgroup::"

      # -----------------------------------------------------------------------
      - name: "Generate delta package"
        run: |
          echo "::group::Delta Generation"
          mkdir -p artifact/source

          FROM_SHA="${{ github.event.before }}"
          TO_SHA="${{ github.sha }}"

          # Guard: first push to branch has all-zeros before SHA
          if [[ "$FROM_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "First push detected — using HEAD~1 as FROM"
            FROM_SHA="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi

          echo "Deployment Mode : DELTA"
          echo "Target Org      : ${{ env.ORG_ALIAS }}"
          echo "Commit SHA      : $TO_SHA"
          echo "Branch          : ${{ github.ref_name }}"
          echo "Delta from      : $FROM_SHA"
          echo "Delta to        : $TO_SHA"

          sf sgd source delta \
            --from "$FROM_SHA" \
            --to   "$TO_SHA" \
            --output artifact/source \
            --generate-delta \
            --ignore .forceignore

          cp -f artifact/source/package/package.xml          artifact/package.xml          2>/dev/null || true
          cp -f artifact/source/destructiveChanges/destructiveChanges.xml \
                                                             artifact/destructiveChanges.xml 2>/dev/null || true

          echo "=== package.xml ==="
          cat artifact/package.xml 2>/dev/null || echo "(empty)"
          echo "::endgroup::"

      # -----------------------------------------------------------------------
      - name: "Empty delta guard"
        run: |
          if [ ! -f artifact/package.xml ] || ! grep -q "<members>" artifact/package.xml 2>/dev/null; then
            echo "::notice::No deployable metadata detected. Skipping deploy."
            exit 0
          fi

      # -----------------------------------------------------------------------
      - name: "Inject always-include metadata types (idempotent)"
        run: |
          echo "::group::Dependency Buffer Injection"
          PACKAGE_XML="artifact/package.xml"
          FORCE_APP_DIR="force-app/main/default"

          inject_type() {
            local TYPE_NAME="$1" EXTENSION="$2" SOURCE_DIR="$3"
            if grep -q "<name>${TYPE_NAME}</name>" "$PACKAGE_XML" 2>/dev/null; then
              echo "  $TYPE_NAME already in package.xml — skipping."
              return
            fi
            local MEMBERS
            MEMBERS=$(find "$SOURCE_DIR" -name "*.$EXTENSION" 2>/dev/null \
              | sed "s|${SOURCE_DIR}/||; s|\\.${EXTENSION}||" \
              | sort | tr '\n' ',' | sed 's/,$//')
            if [[ -z "$MEMBERS" ]]; then
              echo "  No $TYPE_NAME members found in source — skipping."
              return
            fi
            echo "  Injecting $TYPE_NAME: $MEMBERS"
            python3 - "$PACKAGE_XML" "$TYPE_NAME" "$MEMBERS" <<'PYEOF'
          import sys
          pkg, tname, csv = sys.argv[1], sys.argv[2], sys.argv[3]
          lines = "".join(f"        <members>{m}</members>\n" for m in csv.split(",") if m.strip())
          block = f"    <types>\n{lines}        <name>{tname}</name>\n    </types>\n"
          with open(pkg) as f:
              content = f.read()
          content = content.replace("</Package>", block + "</Package>")
          with open(pkg, "w") as f:
              f.write(content)
          PYEOF
          }

          inject_type "Profile"       "profile-meta.xml"       "$FORCE_APP_DIR/profiles"
          inject_type "PermissionSet" "permissionset-meta.xml" "$FORCE_APP_DIR/permissionsets"
          inject_type "Flow"          "flow-meta.xml"          "$FORCE_APP_DIR/flows"

          echo "=== Final package.xml ==="
          cat "$PACKAGE_XML"
          echo "::endgroup::"

      # -----------------------------------------------------------------------
      - name: "Detect test classes from delta source files"
        id: tests
        run: |
          # Fix 3: Scan actual *Test.cls files — never pass zero classes to RunSpecifiedTests.
          TEST_CLASSES=$(find artifact/source -name "*Test.cls" 2>/dev/null \
            | xargs -I{} basename {} .cls 2>/dev/null \
            | sort -u | tr '\n' ',' | sed 's/,$//')

          if [[ -n "$TEST_CLASSES" ]]; then
            echo "Test Level      : RunSpecifiedTests"
            echo "Test Classes    : $TEST_CLASSES"
            echo "test_flags=--test-level RunSpecifiedTests --tests ${TEST_CLASSES}" >> "$GITHUB_OUTPUT"
          else
            echo "Test Level      : RunLocalTests (no *Test.cls files in delta)"
            echo "test_flags=--test-level RunLocalTests" >> "$GITHUB_OUTPUT"
          fi

      # -----------------------------------------------------------------------
      - name: "Compute short SHA"
        id: sha
        run: echo "short=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      - name: "Write deploy-metadata.json"
        run: |
          cat > artifact/deploy-metadata.json <<JSON
          {
            "sha":        "${{ github.sha }}",
            "shortSha":   "${{ steps.sha.outputs.short }}",
            "branch":     "${{ github.ref_name }}",
            "org":        "${{ env.ORG_ALIAS }}",
            "timestamp":  "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "testLevel":  "${{ steps.tests.outputs.test_flags }}",
            "isDelta":    true,
            "deployType": "delta",
            "workflow":   "${{ github.workflow }}",
            "runId":      "${{ github.run_id }}"
          }
          JSON

      # -----------------------------------------------------------------------
      # Attempt to restore a cached validation job ID (from validate.yml on PR).
      # Works for fast-forward merges where github.sha matches the PR head SHA.
      # Falls through silently if cache miss — full deploy is the fallback.
      # -----------------------------------------------------------------------
      - name: "Restore cached validation job ID"
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .validation-job-id
          key: validation-job-id-${{ github.sha }}

      # -----------------------------------------------------------------------
      - name: "Deploy to cwQA (quick deploy → full deploy fallback, with retry)"
        run: |
          PACKAGE_XML="artifact/package.xml"
          ORG="${{ env.ORG_ALIAS }}"
          TEST_FLAGS="${{ steps.tests.outputs.test_flags }}"
          FINAL_STATUS="Unknown"

          # ---- Attempt Quick Deploy ----
          if [[ -f .validation-job-id ]]; then
            VALIDATE_JOB_ID=$(cat .validation-job-id)
            echo "==> Attempting Quick Deploy (job ID: $VALIDATE_JOB_ID)"

            QUICK_OUTPUT=$(sf project deploy quick \
              --job-id     "$VALIDATE_JOB_ID" \
              --target-org "$ORG" \
              --wait       30 \
              --json 2>&1 || true)

            FINAL_STATUS=$(echo "$QUICK_OUTPUT" | python3 -c "
          import sys, json
          try:
              d = json.loads(sys.stdin.read())
              print(d.get('result', {}).get('status', 'Unknown'))
          except Exception:
              print('ParseError')
          " 2>/dev/null || echo "ParseError")

            echo "Quick deploy status: $FINAL_STATUS"

            if [[ "$FINAL_STATUS" == "Succeeded" ]]; then
              echo "Quick deploy succeeded."
              exit 0
            else
              echo "Quick deploy failed/expired — falling back to full deploy."
            fi
          else
            echo "No cached validation job ID — proceeding with full deploy."
          fi

          # ---- Full Deploy with Retry ----
          MAX_ATTEMPTS=2
          ATTEMPT=1
          while [[ $ATTEMPT -le $MAX_ATTEMPTS ]]; do
            echo "==> Full deploy attempt $ATTEMPT of $MAX_ATTEMPTS"

            DEPLOY_OUTPUT=$(sf project deploy start \
              --manifest   "$PACKAGE_XML" \
              --target-org "$ORG" \
              --wait       30 \
              $TEST_FLAGS \
              --json 2>&1 || true)

            FINAL_STATUS=$(echo "$DEPLOY_OUTPUT" | python3 -c "
          import sys, json
          try:
              d = json.loads(sys.stdin.read())
              print(d.get('result', {}).get('status', 'Unknown'))
          except Exception:
              print('ParseError')
          " 2>/dev/null || echo "ParseError")

            echo "$DEPLOY_OUTPUT"
            echo "Deploy status: $FINAL_STATUS"

            if [[ "$FINAL_STATUS" == "Succeeded" ]]; then
              echo "Full deploy succeeded on attempt $ATTEMPT."
              break
            fi

            ATTEMPT=$((ATTEMPT + 1))
            if [[ $ATTEMPT -le $MAX_ATTEMPTS ]]; then
              echo "Retrying in 15 seconds..."
              sleep 15
            fi
          done

          if [[ "$FINAL_STATUS" != "Succeeded" ]]; then
            echo "::error::All deploy attempts failed. Final status: $FINAL_STATUS"
            exit 1
          fi

      # -----------------------------------------------------------------------
      - name: "Upload Full Context Artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-cwqa-${{ steps.sha.outputs.short }}
          path: artifact/
          retention-days: 30

      # -----------------------------------------------------------------------
      - name: "Cleanup JWT key"
        if: always()
        run: rm -f /tmp/server.key
